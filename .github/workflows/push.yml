# Refreshes the JSON snapshot behind a read-only HTTP API, from a free runner.
#
# The serving Worker cannot fetch the upstream site itself (blocked by its TLS
# fingerprint), so this runner does it: it installs curl-impersonate, runs the
# scrape, and POSTs the snapshots to the API's push endpoint.
#
# Public repo => unlimited Actions minutes, so the schedule can run often. The
# schedule event is best-effort (GitHub can start a run late or drop a slot
# without leaving a failed run), so the minutes are staggered and avoid :00.
name: Sync snapshot

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-snapshot
  cancel-in-progress: false

env:
  SITE_URL: https://cs2api-461yz8-preview.freebuff.site
  # Chrome 116's TLS fingerprint is the one the upstream accepts from runners.
  HLTV_IMPERSONATE: chrome116

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache/teams.json
          key: teams-${{ github.run_id }}
          restore-keys: teams-

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Install curl-impersonate
        run: npm run setup:curl

      - name: Scrape and push
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: npm run push

      - name: Confirm the API serves the new snapshot
        run: |
          curl -fsS "$SITE_URL/api/meta" | tee meta.json
          node -e "const m=require('./meta.json').snapshots; console.log('matches', m.matches.count, 'at', m.matches.updatedAt, '| teams', m.teams && m.teams.count)"

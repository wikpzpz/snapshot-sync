# Keeps the hosted cs2api snapshot fresh for free, with no PC involved.
#
# The Worker cannot scrape hltv.org (403 for its fetch, 429 from every free
# renderer because Workers share egress IPs), so this runner does it: it installs
# curl-impersonate, runs `npm run push`, and the Worker's D1 snapshot is replaced.
#
# Minutes: a public repo has unlimited Actions minutes, so a 5-minute schedule
# would be free. A PRIVATE repo gets 2 000 free minutes/month and GitHub bills a
# run as at least one minute — 288 runs/day would burn through that in a week, so
# the schedule stays at roughly every 25 minutes (1 740 min/month).
name: Push cs2api snapshot

on:
  schedule:
    # A run takes ~25 s but GitHub bills it as a full minute, and a private repo
    # gets 2 000 free minutes/month:
    #   */5  = 288/day = ~8 600/month  → needs a public repo (unlimited minutes)
    #   */15 =  96/day = ~2 880/month  → too much for private
    #   3x/hour      =  72/day = ~2 160/month
    #   current      =  58/day = ~1 740/month  → private-safe
    #
    # The schedule event is best-effort, not a timer with an SLA: GitHub's shared
    # cron dispatcher can start a run minutes or (on a brand-new private repo, while
    # the cron is still being registered) hours late, and a skipped slot leaves no
    # run at all. The top of the hour is the busiest moment, so the minutes here
    # deliberately avoid :00 and are spread across the hour.
    - cron: '4,29,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-snapshot
  cancel-in-progress: false

env:
  SITE_URL: https://cs2api-461yz8-preview.freebuff.site
  # GitHub's runners are challenged on chrome131 but served by chrome116
  # (probed: 131/124/120/101 challenged, 116/110/107/104/100/99 fine).
  HLTV_IMPERSONATE: chrome116

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore team-country cache
        uses: actions/cache@v4
        with:
          path: .cache/teams.json
          key: teams-${{ github.run_id }}
          restore-keys: teams-

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Install curl-impersonate
        run: npm run setup:curl

      - name: Scrape and push
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: npm run push

      - name: Confirm the site serves the new snapshot
        run: |
          curl -fsS "$SITE_URL/api/meta" | tee meta.json
          node -e "const m=require('./meta.json').snapshots; console.log('matches', m.matches.count, 'at', m.matches.updatedAt, '| teams', m.teams && m.teams.count)"

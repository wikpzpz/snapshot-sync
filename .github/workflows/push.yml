# Keeps the hosted cs2api snapshot fresh for free, with no PC involved.
#
# The Worker cannot scrape hltv.org (403 for its fetch, 429 from every free
# renderer because Workers share egress IPs), so this runner does it: it installs
# curl-impersonate, runs `npm run push`, and the Worker's D1 snapshot is replaced.
#
# Minutes: a public repo has unlimited Actions minutes, so the 5-minute schedule
# below is free. A PRIVATE repo gets 2 000 free minutes/month and GitHub bills a
# run as at least one minute — 288 runs/day would burn through that in a week, so
# change the cron to '*/30 * * * *' (1 440 min/month) if the repo stays private.
name: Push cs2api snapshot

on:
  schedule:
    # Private repo: GitHub bills at least 1 minute per run and gives 2 000/month,
    # so 30 minutes (~1 440 min/month) stays free. Make the repo public and this
    # can become '*/5 * * * *' for near-live data at no cost.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-snapshot
  cancel-in-progress: false

env:
  SITE_URL: https://cs2api-461yz8-preview.freebuff.site

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore team-country cache
        uses: actions/cache@v4
        with:
          path: .cache/teams.json
          key: teams-${{ github.run_id }}
          restore-keys: teams-

      - name: Install dependencies
        run: npm ci

      - name: Install curl-impersonate
        run: npm run setup:curl

      - name: Scrape and push
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: npm run push

      - name: Confirm the site serves the new snapshot
        run: |
          curl -fsS "$SITE_URL/api/meta" | tee meta.json
          node -e "const m=require('./meta.json').snapshots; console.log('matches', m.matches.count, 'at', m.matches.updatedAt, '| teams', m.teams && m.teams.count)"

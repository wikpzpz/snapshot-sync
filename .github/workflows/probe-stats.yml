# Diagnostic only: can a runner load /stats/matches/mapstatsid/ pages?
name: Probe stats access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Install curl-impersonate
        run: npm run setup:curl

      - name: Curl-impersonate profiles
        run: node scripts/probe-stats.mjs 245031 2>&1 | head -20

      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npx --yes playwright@1.65.1 install --with-deps chromium

      - name: Headful Chromium
        run: xvfb-run -a node scripts/probe-stats.mjs 245031 2>&1 | tail -20
